name: gates

# Everything here runs without a game client and without network access, which is
# the point: the two things that break this project in practice are a Lua API the
# client rejects and a payload format the two halves disagree about, and both are
# catchable offline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Addon under a stub client API
        run: lua5.1 tests/wow_stub.lua

      - name: Wire format, routing and release lint
        run: |
          python3 tests/roster_test.py
          python3 tests/roundtrip.py
          python3 tests/hostile_test.py
          python3 tests/hosts_test.py
          python3 tests/addon_checks.py
          python3 tests/package_test.py
          python3 tests/notify_test.py

      - name: The release zip is what the client and an installer want
        run: python3 scripts/package_addon.py --out dist

      - name: Every Lua file compiles
        run: |
          for file in addon/HermesAI/*.lua; do luac5.1 -p "$file" || exit 1; done
